name: Refresh Backtests

on:
  workflow_dispatch:

concurrency:
  group: refresh-backtests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh market data and backtests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      TWELVEDATA_API_KEYS: ${{ secrets.TWELVEDATA_API_KEYS }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_API_BASE_URL: ${{ vars.OANDA_API_BASE_URL || 'https://api-fxpractice.oanda.com' }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SIGNAL_CONSOLE_STORAGE_PREFIX: ${{ vars.SIGNAL_CONSOLE_STORAGE_PREFIX || 'signal-console' }}

    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Plan targeted Firebase refresh inputs
        run: |
          mkdir -p .local
          node --import tsx scripts/backtest-refresh-plan.ts --out=.local/backtest-refresh-plan.json
          echo "DATA_PULL_PATHS=$(node --import tsx scripts/backtest-refresh-plan.ts --field=dataPullPaths)" >> "$GITHUB_ENV"
          echo "BACKTEST_CSV_PATHS=$(node --import tsx scripts/backtest-refresh-plan.ts --field=backtestCsvPaths)" >> "$GITHUB_ENV"
          echo "SOURCE_ASSET_KEYS=$(node --import tsx scripts/backtest-refresh-plan.ts --field=sourceAssetKeys)" >> "$GITHUB_ENV"

      - name: Pull current source candles from Firebase
        run: node --import tsx scripts/firebase-pull.ts --paths="$DATA_PULL_PATHS"

      - name: Pull current backtest CSVs from Firebase
        run: node --import tsx scripts/firebase-pull.ts --paths="$BACKTEST_CSV_PATHS" --ignore-missing

      - name: Rebuild derived timeframes locally
        run: python backtest-engine/runner.py prepare-data --asset "$SOURCE_ASSET_KEYS"

      - name: Capture current data tails
        run: node --import tsx scripts/capture-data-tails.ts --out=.local/data-tail-state.json

      - name: Run backtests
        env:
          AUTO_BACKTEST_OVERLAP_DAYS: ${{ vars.AUTO_BACKTEST_OVERLAP_DAYS || '7' }}
        run: |
          python backtest-engine/runner.py run-backtests \
            --incremental \
            --incremental-overlap-days "$AUTO_BACKTEST_OVERLAP_DAYS" \
            --incremental-start-state .local/data-tail-state.json

      - name: Upload changed backtest CSVs and manifest to Firebase
        run: node --import tsx scripts/firebase-sync.ts --paths="$BACKTEST_CSV_PATHS" --changed-only
