name: Refresh Backtests

on:
  workflow_dispatch:

concurrency:
  group: refresh-backtests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh market data and backtests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      TWELVEDATA_API_KEYS: ${{ secrets.TWELVEDATA_API_KEYS }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_API_BASE_URL: ${{ vars.OANDA_API_BASE_URL || 'https://api-fxpractice.oanda.com' }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SIGNAL_CONSOLE_STORAGE_PREFIX: ${{ vars.SIGNAL_CONSOLE_STORAGE_PREFIX || 'signal-console' }}

    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare refresh workspace
        run: mkdir -p .local

      - name: Pull current backtest manifest from Firebase
        run: node --import tsx scripts/firebase-pull.ts --paths=cache/backtest-manifest.json --ignore-missing

      - name: Plan source candle tail window
        run: |
          node --import tsx scripts/backtest-stale-plan.ts --out=.local/source-tail-plan.json --incremental-start-state-out=.local/source-tail-start-state.json
          echo "SOURCE_STALE_DATA_PULL_PATHS=$(node --import tsx scripts/backtest-stale-plan.ts --field=staleDataPullPaths)" >> "$GITHUB_ENV"
          echo "SOURCE_STALE_SOURCE_ASSET_KEYS=$(node --import tsx scripts/backtest-stale-plan.ts --field=staleSourceAssetKeys)" >> "$GITHUB_ENV"
          echo "SOURCE_STALE_STRATEGY_IDS=$(node --import tsx scripts/backtest-stale-plan.ts --field=staleStrategyIds)" >> "$GITHUB_ENV"

      - name: No stale backtests
        if: env.SOURCE_STALE_STRATEGY_IDS == ''
        run: echo "Backtest manifest is already computed through the latest market-data coverage."

      - name: Pull current source candles from Firebase
        if: env.SOURCE_STALE_STRATEGY_IDS != ''
        env:
          AUTO_BACKTEST_DATA_TAIL_ROWS: ${{ vars.AUTO_BACKTEST_DATA_TAIL_ROWS || '12000' }}
          AUTO_BACKTEST_OVERLAP_DAYS: ${{ vars.AUTO_BACKTEST_OVERLAP_DAYS || '7' }}
        run: |
          node --import tsx scripts/firebase-pull.ts \
            --paths="$SOURCE_STALE_DATA_PULL_PATHS" \
            --tail-rows="$AUTO_BACKTEST_DATA_TAIL_ROWS" \
            --tail-since-state=.local/source-tail-start-state.json \
            --tail-overlap-days="$AUTO_BACKTEST_OVERLAP_DAYS"

      - name: Rebuild derived timeframes locally
        if: env.SOURCE_STALE_STRATEGY_IDS != ''
        run: python backtest-engine/runner.py prepare-data --asset "$SOURCE_STALE_SOURCE_ASSET_KEYS"

      - name: Capture current data tails
        if: env.SOURCE_STALE_STRATEGY_IDS != ''
        run: node --import tsx scripts/capture-data-tails.ts --out=.local/data-tail-state.json

      - name: Plan stale backtests
        if: env.SOURCE_STALE_STRATEGY_IDS != ''
        run: |
          node --import tsx scripts/backtest-stale-plan.ts --out=.local/backtest-stale-plan.json --incremental-start-state-out=.local/backtest-incremental-start-state.json
          echo "STALE_BACKTEST_CSV_PATHS=$(node --import tsx scripts/backtest-stale-plan.ts --field=staleBacktestCsvPaths)" >> "$GITHUB_ENV"
          echo "STALE_STRATEGY_IDS=$(node --import tsx scripts/backtest-stale-plan.ts --field=staleStrategyIds)" >> "$GITHUB_ENV"

      - name: No stale backtests after source pull
        if: env.SOURCE_STALE_STRATEGY_IDS != '' && env.STALE_STRATEGY_IDS == ''
        run: echo "Backtest manifest is already computed through the current candle tails."

      - name: Pull stale backtest CSVs from Firebase
        if: env.STALE_STRATEGY_IDS != ''
        run: node --import tsx scripts/firebase-pull.ts --paths="$STALE_BACKTEST_CSV_PATHS" --ignore-missing

      - name: Run stale backtests
        if: env.STALE_STRATEGY_IDS != ''
        env:
          AUTO_BACKTEST_OVERLAP_DAYS: ${{ vars.AUTO_BACKTEST_OVERLAP_DAYS || '7' }}
        run: |
          python backtest-engine/runner.py run-backtests \
            --strategy "$STALE_STRATEGY_IDS" \
            --timings \
            --incremental \
            --incremental-overlap-days "$AUTO_BACKTEST_OVERLAP_DAYS" \
            --incremental-start-state .local/backtest-incremental-start-state.json

      - name: Upload changed backtest CSVs and manifest to Firebase
        if: env.STALE_STRATEGY_IDS != ''
        run: node --import tsx scripts/firebase-sync.ts --paths="$STALE_BACKTEST_CSV_PATHS" --changed-only --catalog-strategy-ids="$STALE_STRATEGY_IDS" --computed-through-state=.local/data-tail-state.json
